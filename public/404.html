<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página no encontrada · Colágeno Vital</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d7a68'/%3E%3Cpath d='M32 13c8 8 13 14 13 21a13 13 0 0 1-26 0c0-7 5-13 13-21z' fill='%23eafff9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/base.css" />
  <style>
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(800px 500px at 80% -10%, rgba(13, 122, 104, 0.14), transparent 60%),
        var(--bg);
    }
    .not-found {
      max-width: 470px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
    }
    .not-found .mark {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(145deg, #12907e, #09594c);
      color: #ecfff9;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      box-shadow: 0 14px 30px -14px rgba(9, 84, 71, 0.8);
    }
    .not-found .mark svg {
      width: 30px;
      height: 30px;
    }
    .not-found .code {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: var(--primary);
      text-transform: uppercase;
    }
    .not-found h1 {
      margin: 10px 0;
      font-size: 27px;
      letter-spacing: -0.03em;
    }
    .not-found p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .not-found .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .not-found .actions a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3c3.5 3.8 6 6.8 6 10a6 6 0 0 1-12 0c0-3.2 2.5-6.2 6-10z" />
        <path d="M12 21v-5" />
      </svg>
    </div>
    <div class="code">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace haya cambiado o que la dirección esté incompleta. Vuelve al inicio o abre el asistente con IA para resolver tus dudas.</p>
    <div class="actions">
      <a class="btn" href="/">Ir al inicio</a>
      <a class="btn btn-secondary" href="/embed.html">Abrir asistente con IA</a>
    </div>
  </main>
  <script src="/widget.js" defer></script>
</body>
</html>
